[project]
name = "bioimpedance-dx"
version = "0.1.0"
description = ""
authors = [
    {name = "surafel",email = "surafel.mint@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.9.0,<2.0.0",
    "pandas>=2.0,<3",
    "openpyxl>=3.1.5,<4.0.0",
    "pydantic>=2.5,<3.0",
    "mlflow>=3.0,<4.0",
]

[tool.poetry]
packages = [{include = "bioimpedance_dx"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy>=2.1.0,<3.0.0",
    "pandas-stubs>=3.0.3.260530,<4.0.0.0",
]

[tool.mypy]
files = ["bioimpedance_dx", "scripts", "tests"]
exclude = ["^data/"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["mlflow.*", "sklearn.*"]
ignore_missing_imports = true
